[pytest]
# Run from the project root: pytest tests/
# For verbose output:        pytest tests/ -v
# For a specific file:       pytest tests/test_delimiter_detection.py -v
# For debug output:          LOG_LEVEL=DEBUG pytest tests/ -v

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show the 10 slowest tests after each run
addopts = --tb=short --durations=10

# If one test runs longer than 5 minutes (the longest normally takes about 3),
# print where every part of the program is at that moment -- so a test that
# hangs says by itself where it is stuck.
faulthandler_timeout = 300
