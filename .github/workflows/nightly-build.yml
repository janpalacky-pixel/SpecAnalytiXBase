# Rebuilds the Windows installer once a day (on a schedule, not on every
# push) and publishes it under a single, permanent "nightly" GitHub
# Release — so users who want the current development build can always
# use the same download link, instead of digging through commits or
# building it themselves.
#
# Deliberately NOT triggered by push: pushing straight to main several
# times a day would otherwise mean several full rebuilds a day, for no
# benefit (this isn't running tests that need fast per-push feedback, it's
# just producing a downloadable installer). A daily schedule bounds that
# to at most one automatic build a day, however many times you pushed.
# Use workflow_dispatch (the "Run workflow" button) for an extra build
# right now, same as before.
#
# This is NOT a substitute for the normal, versioned Releases (v1.x.x):
# those stay exactly as they are — hand-tagged, hand-published, stable
# snapshots. This workflow only maintains a separate "nightly" release
# that tracks main's latest state. See resources/test_data/real/README.md-
# style docs below for how someone would use each.
#
# Cost: this repository is public, so GitHub Actions minutes (including
# the windows-latest runner used here) are free and unmetered — no paid
# plan, billing, or secrets setup needed. GITHUB_TOKEN, used below to
# publish the release, is created automatically for every workflow run.
#
# Mirrors BuildInstaller.bat's two steps (PyInstaller, then Inno Setup)
# exactly, so the CI build matches a local build byte-for-byte in
# everything but the signing/timestamp metadata Windows itself adds.

# Tag/release is named "nightly" (not "latest") so it never collides
# with GitHub's own /releases/latest shortcut, which always points at
# the newest non-prerelease (tagged vX.Y.Z) release, not this one.
name: Nightly build

on:
  # Once a day, from whatever is on main at that moment. Times are UTC;
  # 2am UTC is late evening in most of the US and early morning in Europe,
  # picked simply to be an off-hours default — change it to whenever suits
  # you, it has no effect on build correctness.
  schedule:
    - cron: '0 2 * * *'
  # Lets you trigger a rebuild by hand from the Actions tab, without
  # waiting for the schedule.
  workflow_dispatch: {}

# Without this, a workflow's GITHUB_TOKEN is read-only by default on
# repositories created after Feb 2023 — the release-publishing step
# below would fail with a 403/"Resource not accessible" error. Declaring
# it here overrides that default for this workflow specifically, with no
# repository-settings change required.
permissions:
  contents: write

# If two pushes land close together, cancel the older in-progress build
# rather than letting both finish and race to publish "nightly".
concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      # Runs the same suite documented in tests/README.md. If anything
      # fails, this step fails and GitHub Actions stops the job right
      # here by default — the build/publish steps below never run, so a
      # broken change can't make it into the published "nightly"
      # installer. This check happens automatically on every build,
      # scheduled or manual, independently of anyone remembering to run
      # it by hand first.
      - name: Run test suite
        run: pytest tests/

      # Same invocation as BuildInstaller.bat's first step.
      - name: Build with PyInstaller
        run: >-
          pyinstaller --name="SpecAnalytiXBase" --windowed --onedir
          --add-data "resources;resources"
          --icon="resources/icons/app_icon.ico" main.py

      # windows-latest doesn't ship Inno Setup — install it via
      # Chocolatey, which does ship on every windows-latest runner.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Same invocation as BuildInstaller.bat's second step.
      - name: Build installer with Inno Setup
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      # installer.iss names the file after MyAppVersion (e.g.
      # Setup_for_SpecAnalytiXBase_ver_1.3.0.exe), so the download link
      # would change on every version bump. Keep the "nightly" release's
      # link permanently stable by also publishing a fixed-name copy.
      - name: Add a version-independent copy for the "nightly" link
        shell: pwsh
        run: |
          $built = Get-ChildItem -Path installer -Filter *.exe | Select-Object -First 1
          Copy-Item $built.FullName "installer\SpecAnalytiXBase-nightly-setup.exe"

      - name: Publish/update the "nightly" release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: 'Nightly development build'
          body: |
            Automatically rebuilt from commit ${{ github.sha }}
            (${{ github.event.head_commit.timestamp }}).

            **This is not a tested, stable release** — it tracks the tip
            of `main` and is replaced on every push. For a tested,
            versioned release, use one of the normal Releases instead
            (tagged vX.Y.Z).

            Download: `SpecAnalytiXBase-nightly-setup.exe` below — this
            filename never changes, so the link stays the same across
            rebuilds.
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: 'installer/*.exe'
          token: ${{ secrets.GITHUB_TOKEN }}
